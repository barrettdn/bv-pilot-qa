<style>

// ══════════════════════════════════════════════════════
// AIRTABLE API
// ══════════════════════════════════════════════════════

function atHeaders() {
  return {
    'Authorization': 'Bearer ' + CONFIG.apiKey,
    'Content-Type': 'application/json'
  };
}

function atUrl(table, params='') {
  return `https://api.airtable.com/v0/${CONFIG.baseId}/${encodeURIComponent(table)}${params}`;
}

async function atGet(table, filterFormula) {
  const params = filterFormula
    ? '?filterByFormula=' + encodeURIComponent(filterFormula)
    : '';
  const res = await fetch(atUrl(table, params), { headers: atHeaders() });
  if (!res.ok) throw new Error('Airtable GET failed: ' + res.status + ' ' + await res.text());
  return res.json();
}

async function atCreate(table, fields) {
  const res = await fetch(atUrl(table), {
    method: 'POST',
    headers: atHeaders(),
    body: JSON.stringify({ fields })
  });
  if (!res.ok) throw new Error('Airtable POST failed: ' + res.status + ' ' + await res.text());
  return res.json();
}

async function atDelete(table, recordId) {
  const res = await fetch(atUrl(table) + '/' + recordId, {
    method: 'DELETE',
    headers: atHeaders()
  });
  if (!res.ok) throw new Error('Airtable DELETE failed: ' + res.status);
  return res.json();
}

// ══════════════════════════════════════════════════════
// LOAD ALL ANSWERS FROM AIRTABLE
// ══════════════════════════════════════════════════════

async function loadAnswers() {
  const data = await atGet(CONFIG.answersTable);
  answers = {};
  for (const rec of data.records) {
    const f  = rec.fields;
    const qid = f['QuestionID'];
    if (!qid) continue;
    if (!answers[qid]) answers[qid] = [];
    answers[qid].push({
      author:      f['Author'] || 'Unknown',
      text:        f['Answer'] || '',
      ts:          new Date(f['Timestamp'] || rec.createdTime).getTime(),
      airtableId:  rec.id
    });
  }
  // Sort each question's answers by timestamp
  for (const qid of Object.keys(answers)) {
    answers[qid].sort((a,b) => a.ts - b.ts);
  }
}

async function loadFollowups() {
  try {
    const data = await atGet(CONFIG.followupsTable);
    followups = {};
    for (const rec of data.records) {
      const f     = rec.fields;
      const catId = f['CategoryID'];
      if (!catId) continue;
      if (!followups[catId]) followups[catId] = [];
      followups[catId].push({
        id:          rec.id,
        text:        f['Question'] || '',
        ctx:         f['Context'] || 'AI-generated follow-up',
        airtableId:  rec.id
      });
    }
  } catch(e) {
    console.warn('Followups table may not exist yet:', e.message);
  }
}

  document.getElementById('config-section').innerHTML = '';
  document.getElementById('content').innerHTML =
    '<div class="loading-card"><div class="spinner"></div><br>Loading responses…</div>';

  try {
    await Promise.all([loadAnswers(), loadFollowups()]);
  } catch(e) {
    document.getElementById('content').innerHTML =
      `<div class="loading-card" style="color:var(--red)">
        Could not connect to Airtable.<br>
        <small>${e.message}</small>
      </div>`;
    return;
  }

  render();
}

// ══════════════════════════════════════════════════════
// SUBMIT
// ══════════════════════════════════════════════════════

async function doSubmit(qid) {
  const ta = document.getElementById('ta-' + qid);
  if (!ta) return;
  const text = ta.value.trim();
  if (!text) { toast('Please type an answer first', false); return; }

  const btn = document.getElementById('sb-' + qid);
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }

  const entry = {
    author: responder,
    text,
    ts: Date.now(),
    airtableId: null
  };

  // Optimistic update
  if (!answers[qid]) answers[qid] = [];
  answers[qid].push(entry);
  ta.value = '';
  render();
  toast('✓ Saved', true);

  // Persist to Airtable
  try {
    const rec = await atCreate(CONFIG.answersTable, {
      QuestionID: qid,
      Author:     responder,
      Answer:     text,
      Timestamp:  new Date().toISOString()
    });
    // Store the Airtable record ID so we could delete/edit later
    entry.airtableId = rec.id;
  } catch(e) {
    toast('⚠ Answer shown but not saved to Airtable: ' + e.message, false);
    console.error('Airtable save error:', e);
  }
}

// ══════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════

function render() {
  renderTabs();
  renderSummary();
  renderContent();
  renderProgress();
}

function renderConfigSection() {
  document.getElementById('config-section').innerHTML = `
    <div class="config-banner">
      <div class="config-title">⚙ Setup Required — Connect to Airtable</div>
      <div class="config-desc">
        This tool stores all responses in Airtable so anyone with the link can read and submit answers — no account required.
        You need to create a free Airtable base and paste your credentials below, or edit the CONFIG block at the top of this HTML file.
      </div>

      <div class="config-row">
        <div class="config-label">Step 1 — Create a free Airtable account at airtable.com</div>
      </div>

      <div class="config-row">
        <div class="config-label">Step 2 — Create a new Base called "BV Pilot Q&A"</div>
        <div class="config-note">Inside the base, create two tables with these exact columns:</div>
        <div class="config-code">Table 1: "Answers"
Columns: QuestionID (text), Author (text), Answer (long text), Timestamp (text)

Table 2: "Followups"
Columns: CategoryID (text), Question (long text), Context (long text)</div>
      </div>

      <div class="config-row">
        <div class="config-label">Step 3 — Create a Personal Access Token</div>
        <div class="config-note">Go to airtable.com/create/tokens → Create token → Add scopes: data.records:read + data.records:write → Add your base → Copy the token</div>
      </div>

      <div class="config-row">
        <div class="config-label">Step 4 — Find your Base ID</div>
        <div class="config-note">Go to airtable.com/api → click your base → the URL shows: airtable.com/api/v0/<b>appXXXXXXXX</b>/... — copy that ID</div>
      </div>

      <div class="config-row">
        <div class="config-label">Paste credentials here to test:</div>
        <input class="config-input" id="cfg-key" placeholder="Personal Access Token (pat...)" />
        <input class="config-input" id="cfg-base" placeholder="Base ID (app...)" style="margin-top:6px"/>
        <button class="config-btn" style="margin-top:10px" onclick="applyConfig()">Connect & Test</button>
      </div>

      <div class="config-note" style="margin-top:12px;color:var(--red)">
        ⚠ Once connected, edit the CONFIG block at the top of this file with your credentials and re-deploy. The fields above are for testing only and won't persist on reload.
      </div>
    </div>`;
}

function applyConfig() {
  const key  = document.getElementById('cfg-key').value.trim();
  const base = document.getElementById('cfg-base').value.trim();
  if (!key || !base) { toast('Enter both token and base ID', false); return; }
  CONFIG.apiKey  = key;
  CONFIG.baseId  = base;
  configured = true;
  document.getElementById('config-section').innerHTML = '';
  boot();
}

function renderTabs() {
  document.getElementById('tabs').innerHTML = CATS.map(c =>
    `<div class="tab ${c.id===activeCat?'active':''}" onclick="switchCat('${c.id}')">${c.label}</div>`
  ).join('');
}

function renderProgress() {
  const allQs = CATS.flatMap(c => c.qs);
  const fuAll  = Object.values(followups).flat();
  const total  = allQs.length + fuAll.length;
  const done   = Object.keys(answers).filter(k => answers[k]?.length > 0).length;
  const pct    = total ? Math.round(done/total*100) : 0;
  document.getElementById('pfill').style.width  = pct + '%';
  document.getElementById('plabel').textContent = `${done} of ${total} answered`;
}

function renderSummary() {
  const allQs = CATS.flatMap(c => c.qs);
  const fuAll  = Object.values(followups).flat();
  const total  = allQs.length + fuAll.length;
  const done   = Object.keys(answers).filter(k => answers[k]?.length > 0).length;
  const rCount = Object.values(answers).reduce((s,a) => s+(a?.length||0), 0);
  document.getElementById('summary').innerHTML = `
    <div class="summary">
      <div class="sstat"><div class="sn">${total}</div><div class="sl">Questions</div></div>
      <div class="sstat"><div class="sn">${done}</div><div class="sl">Answered</div></div>
      <div class="sstat"><div class="sn">${Object.values(followups).flat().length}</div><div class="sl">Follow-ups</div></div>
      <div class="sstat"><div class="sn">${rCount}</div><div class="sl">Responses</div></div>
    </div>`;
}

function renderContent() {
  const cat    = CATS.find(c => c.id === activeCat);
  const fuList = (followups[activeCat] || []).map(fq => ({...fq, isFU:true}));
  const allQs  = [...cat.qs, ...fuList];
  const catIdx = CATS.indexOf(cat);

  let html = `
    <div class="ceyebrow">Category ${catIdx+1} of ${CATS.length}</div>
    <div class="ctitle">${cat.title}</div>
    <div class="cdesc">${cat.desc}</div>
  `;

  allQs.forEach((q, qi) => {
    const ans     = answers[q.id] || [];
    const hasSome = ans.length > 0;
    const isFU    = !!q.isFU;
    const qNum    = isFU ? 'Follow-up' : `Question ${qi+1} of ${allQs.length}`;

    html += `<div class="qcard ${hasSome?'answered':''} ${isFU?'followup':''}">
      <div class="qhead">
        <div class="qmeta">
          <span class="badge ${hasSome?'done':isFU?'fu':''}">${hasSome?'✓ Answered':isFU?'⟡ Follow-up':'Pending'}</span>
          <span class="qnum">${qNum}${!isFU?' &middot; '+q.id.toUpperCase():''}</span>
        </div>
        <div class="qtext">${q.text}</div>
        ${q.ctx ? `<div class="qctx">${q.ctx}</div>` : ''}
      </div>`;

    if (hasSome) {
      html += `<div class="answers-wrap"><div class="alabel">Responses (${ans.length})</div>`;
      ans.forEach(a => {
        const c = COLORS[a.author] || '#666';
        html += `<div class="abubble" style="border-left:3px solid ${c}">
          <div class="ameta">
            <span class="aauthor" style="color:${c}">${esc(a.author)}</span>
            <span class="atime">${fmtTime(a.ts)}</span>
          </div>
          <div class="atext">${esc(a.text)}</div>
        </div>`;
      });
      html += `</div>`;
    }

    html += `<div class="inputarea">
      <div class="ilabel">Your response:</div>
      <div class="responders" id="resp-${q.id}">
        ${PEOPLE.map(p => {
          const active = responder === p;
          const c = COLORS[p] || '#666';
          const style = active ? `background:${c};color:#fff;border-color:${c}` : '';
          return `<button class="rbtn" style="${style}" onclick="setResponder('${p}','${q.id}')">${p}</button>`;
        }).join('')}
      </div>
      <textarea class="ainput" id="ta-${q.id}"
        placeholder="Type your answer here…"
        oninput="document.getElementById('cc-${q.id}').textContent=this.value.length+' chars'"
        rows="3"></textarea>
      <div class="ifooter">
        <span class="ccount" id="cc-${q.id}">0 chars</span>
        <div class="btnrow">
          <button class="sbtn" id="sb-${q.id}" onclick="doSubmit('${q.id}')">Submit</button>
        </div>
      </div>
    </div></div>`;
  });

  document.getElementById('content').innerHTML = html;
}

// ── HELPERS
function switchCat(id) {
  activeCat = id;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function setResponder(name, qid) {
  responder = name;
  const wrap = document.getElementById('resp-' + qid);
  if (wrap) {
    wrap.querySelectorAll('.rbtn').forEach(b => {
      const p = b.textContent.trim();
      const active = p === name;
      const c = COLORS[p] || '#666';
      b.style.background   = active ? c : '';
      b.style.color        = active ? '#fff' : '';
      b.style.borderColor  = active ? c : '';
    });
  }
}

function exportDoc() {
  const lines = ['BV PILOT FRANCHISEE — INVESTOR WORKING DOCUMENT','River Oaks · Southlake', new Date().toLocaleDateString(), ''];
  CATS.forEach(cat => {
    lines.push('═'.repeat(60), cat.title.toUpperCase(), '═'.repeat(60));
    [...cat.qs, ...(followups[cat.id]||[])].forEach(q => {
      lines.push('', `[${(q.id||'FU').toUpperCase()}] ${q.text}`);
      const ans = answers[q.id] || [];
      if (!ans.length) lines.push('  → Not yet answered');
      else ans.forEach(a => lines.push(`  ${a.author}: ${a.text}`));
    });
    lines.push('');
  });
  const blob = new Blob([lines.join('\n')], {type:'text/plain'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = 'BV_Pilot_Investor_QA.txt'; a.click();
  URL.revokeObjectURL(url);
}

function esc(s='') {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}
function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' '+
         d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}
let toastT;
function toast(msg, ok=true) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + (ok ? 'ok' : 'err');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('show'), 3500);
}

boot();
</script>
